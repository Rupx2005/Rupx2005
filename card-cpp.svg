<radialGradient id="cg" cx="0" cy="0" r="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2f6bff" stop-opacity=".2"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></radialGradient>
<clipPath id="r"><rect width="480" height="250" rx="16"/></clipPath>
