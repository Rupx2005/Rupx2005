<circle cx="343" cy="35" r="3.5" fill="#2f6bff"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="353" y="39" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#e6edf3">in progress</text>
